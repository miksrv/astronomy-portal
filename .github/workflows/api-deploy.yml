name: API Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**/*'

# https://github.com/codeigniter4/CodeIgniter4/blob/develop/.github/workflows/deploy-apidocs.yml
jobs:
  api-ssh-deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Docs: https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, intl, curl, dom
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: server

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
        working-directory: server

      - name: Install LFTP
        run: sudo apt install lftp

      - name: Configure LFTP
        run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

      - name: Load Secrets
        run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

      # The API has no server of its own to serve a maintenance page from -
      # it's plain PHP on shared hosting - so it borrows the frontend VPS
      # (same nginx config as ui-deploy.yml) purely to flip its own lock
      # file there for the duration of the FTP mirror below.
      - name: Configure SSH
        env:
          SSH_HOST: ${{secrets.SSH_HOST}}
          SSH_PORT: ${{secrets.SSH_PORT}}
          SSH_USER: ${{secrets.SSH_USER}}
          SSH_KEY: ${{secrets.SSH_KEY}}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 400 ~/.ssh/deploy
          cat >>~/.ssh/config <<END
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking no
          END

      - name: Enable maintenance mode
        run: ssh vps "mkdir -p /var/www/astro.miksoft.pro/.deploy-lock && touch /var/www/astro.miksoft.pro/.deploy-lock/api.lock"

      - name: Upload Folder
        run: |
          lftp -e "rm -r app" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "rm -r vendor" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "put -O / .htaccess" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "put -O / spark" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "put -O / env" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "mirror --parallel=100 -R app" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "mirror --parallel=100 -R vendor" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "mirror --parallel=100 -R public" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "mirror --parallel=100 -R writable" ${{ secrets.FTP_HOSTNAME }}
        working-directory: server

      # Runs even if a previous step failed, so a broken deploy never leaves
      # the site stuck behind the maintenance page.
      - name: Disable maintenance mode
        if: always()
        run: ssh vps "rm -f /var/www/astro.miksoft.pro/.deploy-lock/api.lock"
