name: UI Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'client/**/*'

jobs:
  ui-ssh-deploy:
    name: Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: |
            client/node_modules
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('client/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install dependencies
        working-directory: client
        run: yarn workspaces focus

      - name: Cache UI build
        uses: actions/cache@v4
        id: cache-build
        with:
          path: client/.next
          # Everything the build output depends on: styles, locales and config change it too
          key: ${{ runner.os }}-build-${{ hashFiles('client/**/*.ts', 'client/**/*.tsx', 'client/**/*.sass', 'client/**/*.css', 'client/public/locales/**', 'client/package.json', 'client/yarn.lock', 'client/next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        name: Configure Client
        run: |
          echo "NEXT_PUBLIC_SITE_LINK = '${{ secrets.NEXT_PUBLIC_SITE_LINK }}'
          NEXT_PUBLIC_API_HOST = '${{ secrets.NEXT_PUBLIC_API_HOST }}'
          NEXT_PUBLIC_LAT = 51.7
          NEXT_PUBLIC_LON = 55.2
          NEXT_PUBLIC_THUNDERFOREST_API_KEY = ${{ secrets.NEXT_PUBLIC_THUNDERFOREST_API_KEY }}" > .env
        working-directory: client

      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        name: Build UI
        run: yarn build
        working-directory: client

      # Next's image optimizer needs sharp with the Linux binary inside the standalone
      # bundle. When sharp fails to load, Next does not error: it serves every image as
      # the unoptimized original (no resize, no WebP), which is invisible until someone
      # looks at the response sizes. Fail the deploy instead.
      - name: Check sharp in the standalone bundle
        working-directory: client/.next/standalone
        run: |
          ls node_modules/@img
          node -e "const sharp = require('sharp'); console.log('sharp', sharp.versions.sharp, 'libvips', sharp.versions.vips)"


      - name: Configure SSH
        env:
          SSH_HOST: ${{secrets.SSH_HOST}}
          SSH_PORT: ${{secrets.SSH_PORT}}
          SSH_USER: ${{secrets.SSH_USER}}
          SSH_KEY: ${{secrets.SSH_KEY}}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 400 ~/.ssh/deploy
          cat >>~/.ssh/config <<END
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking no
          END

      # Show the maintenance page (config/nginx.conf) instead of the app for
      # the duration of the file swap + restart below. Kept separate from the
      # api-deploy.yml lock so nginx only clears maintenance once BOTH jobs
      # that started are done.
      - name: Enable maintenance mode
        run: ssh vps "mkdir -p /var/www/astro.miksoft.pro/.deploy-lock && touch /var/www/astro.miksoft.pro/.deploy-lock/ui.lock"

      # If we just use nginx and the application is exported to plain HTML
      #- name: Send files
      #  run: rsync -avz -e ssh ./client/out/ vps:/var/www/astro.miksoft.pro

      # If we run NextJS on a Node server using PM2
      - name: Send files
        run: |
          # Everything but .next/cache and .next/static. The optimized images in the cache do not depend on
          # the build, and a wiped cache makes every image a slow miss after a release; images nobody
          # requested for a month go. The previous builds' static files stay for a week: pages rendered
          # before the release (open tabs, the crawler page cache) still load their chunks and icons
          ssh vps "cd /var/www/astro.miksoft.pro && mkdir -p .next && find .next -mindepth 1 -maxdepth 1 ! -name cache ! -name static -exec rm -rf {} + && (find .next/static -type f -mtime +7 -delete; find .next/static -mindepth 1 -type d -empty -delete; find .next/cache/images -type f -atime +30 -delete) 2>/dev/null || true"
          rsync -avz -e ssh client/.next/standalone/ vps:/var/www/astro.miksoft.pro
          rsync -avz -e ssh client/.next/static vps:/var/www/astro.miksoft.pro/.next
          rsync -avz -e ssh client/public vps:/var/www/astro.miksoft.pro
          rsync -avz -e ssh client/ecosystem.config.js vps:/var/www/astro.miksoft.pro

      # Restarting by the ecosystem file applies its env changes; pm2 save keeps the list for a reboot
      - name: Restart PM2
        run: ssh vps "cd /var/www/astro.miksoft.pro && pm2 restart ecosystem.config.js --update-env && pm2 save"

      # Same check on the host: the binary must also load with the server's Node and glibc
      - name: Check sharp on the host
        run: ssh vps "cd /var/www/astro.miksoft.pro && node -e \"const sharp = require('sharp'); console.log('sharp', sharp.versions.sharp, 'libvips', sharp.versions.vips)\""

      # Runs even if a previous step failed, so a broken deploy never leaves
      # the site stuck behind the maintenance page.
      - name: Disable maintenance mode
        if: always()
        run: ssh vps "rm -f /var/www/astro.miksoft.pro/.deploy-lock/ui.lock"

      # If for deployment we use not SSH, but an FTP connection
      # - name: Export UI
      #  working-directory: client
      #  run: yarn export
      #
      # - name: Install LFTP
      #  run: sudo apt install lftp
      #
      # - name: Configure LFTP
      #  run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc
      #
      # - name: Load Secrets
      #  run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc
      #
      # - name: Upload Folder
      #  run: lftp -e "mirror --parallel=100 -R client/out/ /" ${{ secrets.FTP_HOSTNAME }}
