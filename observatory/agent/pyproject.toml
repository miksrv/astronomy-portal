[project]
name = "observatory-agent"
version = "0.2.0"
description = "Reports the observatory status (INDI, Ekos) to the astronomy portal"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
observatory-agent = "observatory_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["observatory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
