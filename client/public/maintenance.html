<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta
            http-equiv="refresh"
            content="20"
        />
        <meta
            name="robots"
            content="noindex, nofollow"
        />
        <title>Технические работы — Look At Stars</title>
        <style>
            :root {
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100%;
                padding: 24px;
                background: #1b1b1b;
                background-image:
                    radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.6) 0, transparent 50%),
                    radial-gradient(1px 1px at 65% 15%, rgba(255, 255, 255, 0.5) 0, transparent 50%),
                    radial-gradient(1.5px 1.5px at 80% 60%, rgba(255, 255, 255, 0.5) 0, transparent 50%),
                    radial-gradient(1px 1px at 40% 80%, rgba(255, 255, 255, 0.4) 0, transparent 50%),
                    radial-gradient(1.5px 1.5px at 90% 85%, rgba(255, 255, 255, 0.5) 0, transparent 50%),
                    radial-gradient(1px 1px at 10% 65%, rgba(255, 255, 255, 0.4) 0, transparent 50%);
                color: #eaeaea;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            }

            .card {
                max-width: 460px;
                text-align: center;
            }

            .icon {
                font-size: 48px;
                line-height: 1;
                margin-bottom: 16px;
                animation: spin 3.5s linear infinite;
                display: inline-block;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            h1 {
                margin: 0 0 12px;
                font-size: 24px;
                font-weight: 600;
                color: #ffffff;
            }

            p {
                margin: 0 0 8px;
                font-size: 15px;
                line-height: 1.5;
                color: #b3b3b3;
            }

            .hint {
                margin-top: 20px;
                font-size: 13px;
                color: #777777;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <span class="icon">🔭</span>
            <h1>Идут технические работы</h1>
            <p>Мы обновляем сайт — это займёт всего пару минут.</p>
            <p>Страница обновится автоматически, как только всё будет готово.</p>
            <p class="hint">Если работы затянулись — загляните позже.</p>
        </div>
    </body>
</html>
