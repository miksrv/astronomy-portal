# Optimized images (/_next/image): one copy per format, Next renders each size only once
proxy_cache_path /var/cache/nginx/astro.miksoft.pro-images levels=1:2 keys_zone=ASTRO_IMAGES:10m max_size=256m inactive=30d use_temp_path=off;

# The format Next picks for /_next/image from the Accept header (default images.formats: webp)
map $http_accept $astro_image_format {
    default         "";
    "~image/webp"   webp;
}

# Upgrade only for websocket requests, so plain requests keep the upstream connection alive
map $http_upgrade $astro_connection {
    default upgrade;
    ""      "";
}

upstream astro_upstream {
  server 127.0.0.1:3006;
  keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name astro.miksoft.pro www.astro.miksoft.pro;

    server_tokens off;

    root /var/www/astro.miksoft.pro;

    index index.html index.htm;

    client_max_body_size 64M;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    proxy_http_version 1.1;

    # --- Maintenance mode ------------------------------------------------
    # ui-deploy.yml and api-deploy.yml each touch their own lock file right
    # before they start swapping files (rsync+PM2 restart / FTP mirror) and
    # remove it once that step is done. While EITHER lock file is present,
    # every request is served the maintenance page instead of the app - so
    # a client-only, server-only, or simultaneous deploy all show the same
    # "please wait" screen until every job that started has finished.
    set $maintenance "";
    if (-f $document_root/.deploy-lock/ui.lock) {
        set $maintenance "1";
    }
    if (-f $document_root/.deploy-lock/api.lock) {
        set $maintenance "1";
    }
    # Never trap the maintenance page itself behind the check above, or the
    # internal redirect from error_page below would loop forever.
    if ($uri = /maintenance.html) {
        set $maintenance "";
    }
    if ($maintenance = "1") {
        return 503;
    }

    error_page 503 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /var/www/astro.miksoft.pro/public;
        add_header Retry-After 20 always;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build files straight from the disk: immutable, Node never sees them.
    # The deploy keeps the previous builds' files for a week, so old pages still load theirs
    location /_next/static/ {
        alias /var/www/astro.miksoft.pro/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_cache            ASTRO_IMAGES;
        proxy_cache_key        $host$request_uri$astro_image_format;
        proxy_ignore_headers   Cache-Control Expires Vary Set-Cookie;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      any 1m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        add_header             X-Image-Cache $upstream_cache_status;

        proxy_set_header       Host $host;
        proxy_set_header       Connection "";
        proxy_pass             http://astro_upstream;
    }

    # For PM2 server NextJS application
    location / {
        proxy_pass             http://astro_upstream;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;

        proxy_set_header       Host $host;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection $astro_connection;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap last;
    }
}

# Wildcard DNS (*.astro.miksoft.pro) points here too - canonicalize any
# other subdomain to the main domain instead of serving this app under it.
server {
    listen 80;
    listen [::]:80;

    server_name *.astro.miksoft.pro;

    return 301 https://astro.miksoft.pro$request_uri;
}